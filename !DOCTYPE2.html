<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial;
    padding: 20px;
    background: #f5f6f8;
  }

  /* 상단 */
  .top-box {
    background: #f3ddd4;
    padding: 12px;
    text-align: center;
    font-weight: bold;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  /* 전체 영역 */
  .columns {
    display: flex;
    gap: 140px; /* 👉 간격 */
    justify-content: center;
    align-items: flex-start; /* 🔥 중요 */
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* 카드 */
  .card {
    position: relative;
    cursor: pointer;
    border-radius: 16px;
    transition: 0.2s;
  }

  /* 이미지 카드 */
  .img-card {
    width: 300px;              /* 🔥 카드 크기 */
    aspect-ratio: 16 / 9;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: white;
    border: 2px solid #ddd;
  }

  .card:hover {
    transform: scale(1.05);
  }

  .selected {
    border: 3px solid #ff7043;
  }

  .matched {
    border: 3px solid #4CAF50;
    opacity: 0.85;
  }

  /* 체크 */
  .match-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #4CAF50;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .matched .match-badge {
    display: flex;
  }

  /* 틀리면 흔들림 */
  .wrong {
    animation: shake 0.4s;
    border: 3px solid red !important;
  }

  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }

  /* 🔥 연결선 (화면 기준) */
  #lines {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* 하단 */
  .bottom-box {
    margin-top: 20px;
    background: #e6edf7;
    padding: 12px;
    text-align: center;
    border-radius: 10px;
  }

  /* 다시하기 */
  .reset-btn {
    display: block;
    margin: 20px auto;
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    background: #4472C4;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

</style>
</head>

<body>

<div class="top-box">
  🐺 동화 장면과 보안 원칙을 연결해보세요!
</div>

<div class="columns">

  <!-- 왼쪽 -->
  <div class="col">
    <div class="card img-card" id="s1"
      onclick="selectStory('s1')"
      style="background-image:url('left1.png')">
      <div class="match-badge">✓</div>
    </div>

    <div class="card img-card" id="s2"
      onclick="selectStory('s2')"
      style="background-image:url('left2.png')">
      <div class="match-badge">✓</div>
    </div>

    <div class="card img-card" id="s3"
      onclick="selectStory('s3')"
      style="background-image:url('left3.png')">
      <div class="match-badge">✓</div>
    </div>
  </div>

  <!-- 오른쪽 -->
  <div class="col">
    <div class="card img-card" id="b1"
      onclick="selectSecurity('b1')"
      style="background-image:url('right1.png')">
      <div class="match-badge">✓</div>
    </div>

    <div class="card img-card" id="b2"
      onclick="selectSecurity('b2')"
      style="background-image:url('right2.png')">
      <div class="match-badge">✓</div>
    </div>

    <div class="card img-card" id="b3"
      onclick="selectSecurity('b3')"
      style="background-image:url('right3.png')">
      <div class="match-badge">✓</div>
    </div>
  </div>

</div>

<!-- 🔥 선 -->
<svg id="lines"></svg>

<div class="bottom-box" id="status">
  👆 왼쪽을 먼저 클릭하세요!
</div>

<button class="reset-btn" onclick="resetAll()">🔄 다시하기</button>

<script>

let selected = null;

/* 정답 */
const correct = {
  s1: 'b2',
  s2: 'b3',
  s3: 'b1'
};

/* 왼쪽 선택 */
function selectStory(id) {
  document.querySelectorAll('[id^="s"]').forEach(e=>e.classList.remove('selected'));
  selected = id;
  document.getElementById(id).classList.add('selected');
  setStatus("👉 오른쪽을 선택하세요!");
}

/* 오른쪽 선택 */
function selectSecurity(id) {

  if(!selected){
    setStatus("⬅️ 왼쪽 먼저!");
    return;
  }

  const story = selected;

  if(correct[story] === id){

    document.getElementById(story).classList.add('matched');
    document.getElementById(id).classList.add('matched');

    drawLine(story, id);

    setStatus("🎉 정답이에요!");

  } else {

    document.getElementById(story).classList.add('wrong');
    document.getElementById(id).classList.add('wrong');

    setStatus("❌ 다시 생각!");

    setTimeout(()=>{
      document.getElementById(story).classList.remove('wrong','selected');
      document.getElementById(id).classList.remove('wrong');
    },400);
  }

  selected = null;
}

/* 🔥 선 그리기 (완벽 정렬 버전) */
function drawLine(fromId, toId){

  const svg = document.getElementById("lines");

  const from = document.getElementById(fromId).getBoundingClientRect();
  const to = document.getElementById(toId).getBoundingClientRect();

  const x1 = from.right;
  const y1 = from.top + from.height/2;

  const x2 = to.left;
  const y2 = to.top + to.height/2;

  const line = document.createElementNS("http://www.w3.org/2000/svg","line");

  line.setAttribute("x1", x1);
  line.setAttribute("y1", y1);
  line.setAttribute("x2", x2);
  line.setAttribute("y2", y2);

  line.setAttribute("stroke","#4CAF50");
  line.setAttribute("stroke-width","5");
  line.setAttribute("stroke-linecap","round");

  svg.appendChild(line);
}

/* 상태 */
function setStatus(msg){
  document.getElementById("status").innerHTML = msg;
}

/* 다시하기 */
function resetAll(){
  selected = null;

  document.querySelectorAll('.card').forEach(c=>{
    c.classList.remove('selected','matched','wrong');
  });

  document.getElementById("lines").innerHTML = "";

  setStatus("👆 왼쪽을 먼저 클릭하세요!");
}

</script>

</body>
</html>
